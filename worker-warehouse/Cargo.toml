[package]
name = "worker-warehouse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
azalea = { git = "https://github.com/azalea-rs/azalea.git", default-features = false, features = [
    "serde",
    "online-mode",
] }
azalea-core = { git = "https://github.com/azalea-rs/azalea.git" }
azalea-inventory = { git = "https://github.com/azalea-rs/azalea.git" }
bevy_ecs = "0.19.1"
common = { version = "0.1.0", path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = ["macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4"] }
worker_core = { version = "0.1.0", path = "../worker-core" }
