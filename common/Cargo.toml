[package]
edition = "2024"
name = "common"
version = "0.1.0"

[dependencies]
enum_dispatch = "0.3.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0", features = ["uuid"] }
tarpc = { version = "0.38.0", features = ["serde-transport", "serde-transport-bincode", "serde1", "tcp"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }
azalea-registry = { git = "https://github.com/azalea-rs/azalea.git" }
azalea-inventory = { git = "https://github.com/azalea-rs/azalea.git" }

[dev-dependencies]
bincode = "1.3.3"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
