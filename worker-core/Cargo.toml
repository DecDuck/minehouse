[package]
edition = "2024"
name = "worker_core"
version = "0.1.0"

[dependencies]
anyhow = "1.0.104"
azalea = { git = "https://github.com/azalea-rs/azalea.git", default-features = false, features = [
    "serde",
    "online-mode",
] }
azalea-crypto = { git = "https://github.com/azalea-rs/azalea.git" }
common = { path = "../common" }
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml2 = "0.1.3"
tarpc = { version = "0.38.0", features = ["serde-transport", "serde-transport-bincode", "tcp"] }
tokio = { version = "1.53.1", features = ["macros"] }
tracing = "0.1.44"
uuid = "1.26.0"
