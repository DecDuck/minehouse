openapi: 3.0.3
info:
  title: Minehouse
  version: ''
paths:
  /api/v1/queue:
    post:
      summary: Queue a planner request
      operationId: api_queue_queue_request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
  /api/v1/status:
    get:
      summary: Get planner queue and work-unit pool status
      operationId: api_status_get_system_status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
  /api/v1/recipes:
    get:
      summary: List available crafting recipes
      operationId: api_crafting_list_recipes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeResponse'
  /api/v1/crafting:
    get:
      summary: List craft job statuses
      operationId: api_crafting_list_craft_statuses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CraftJobStatus'
    post:
      summary: Queue a resolved craft plan
      operationId: api_crafting_queue_craft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CraftPlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftQueueResponse'
  /api/v1/crafting/plan:
    post:
      summary: Resolve a crafting plan
      operationId: api_crafting_resolve_crafting_plan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CraftPlanRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftPlan'
  /api/v1/crafting/{id}:
    get:
      summary: Get a craft job status
      operationId: api_crafting_get_craft_status
      parameters:
      - name: id
        schema:
          type: string
        in: path
        style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftJobDetail'
  /api/v1/storage:
    get:
      summary: Search indexed storage contents
      operationId: api_storage_list_storage
      parameters:
      - name: q
        schema:
          nullable: true
          type: string
        in: query
        style: form
      - name: region_id
        schema:
          nullable: true
          type: string
        in: query
        style: form
      - name: min_quantity
        schema:
          nullable: true
          type: integer
        in: query
        style: form
      - name: sort_by
        schema:
          $ref: '#/components/schemas/StorageSortBy'
        in: query
        style: form
      - name: sort_direction
        schema:
          $ref: '#/components/schemas/StorageSortDirection'
        in: query
        style: form
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageItem'
  /api/v1/storage/{item_kind}:
    get:
      summary: Get all indexed stacks for an item kind
      operationId: api_storage_get_item_kind_details
      parameters:
      - name: item_kind
        schema:
          type: string
        in: path
        style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemKindDetails'
  /api/v1/containers:
    get:
      summary: List all containers with their current contents
      operationId: api_containers_list_containers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerView'
  /api/v1/containers/grouped:
    get:
      summary: List all containers grouped by region
      operationId: api_containers_list_containers_grouped
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerRegionGroup'
  /api/v1/containers/{id}:
    get:
      summary: Get a container with its current contents
      operationId: api_containers_get_container
      parameters:
      - name: id
        schema:
          type: string
        in: path
        style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerView'
  /api/v1/regions:
    get:
      summary: List all container regions
      operationId: api_regions_list_regions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
    post:
      summary: Create a container region
      operationId: api_regions_create_region
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
  /api/v1/regions/{id}:
    get:
      summary: Get a container region
      operationId: api_regions_get_region
      parameters:
      - name: id
        schema:
          type: string
        in: path
        style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
    put:
      summary: Replace a container region
      operationId: api_regions_update_region
      parameters:
      - name: id
        schema:
          type: string
        in: path
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
    delete:
      summary: Delete a container region
      operationId: api_regions_delete_region
      parameters:
      - name: id
        schema:
          type: string
        in: path
        style: simple
      responses: {}
components:
  schemas:
    ContainerPosition:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
      - x
      - y
      - z
    ContainerRegionGroup:
      type: object
      properties:
        region_id:
          type: string
        region_type:
          $ref: '#/components/schemas/RegionType'
        priority:
          nullable: true
          type: integer
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerView'
      required:
      - region_id
      - containers
    ContainerView:
      type: object
      properties:
        id:
          type: string
        region_id:
          type: string
        position:
          $ref: '#/components/schemas/ContainerPosition'
        capacity:
          type: integer
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ItemStackView'
      required:
      - id
      - region_id
      - position
      - capacity
      - contents
    CraftExecutionNode:
      type: object
      properties:
        key:
          type: string
        item_kind:
          type: string
        required_quantity:
          type: integer
        completed_quantity:
          type: integer
        state:
          type: string
        assigned_region_id:
          nullable: true
          type: string
        error:
          nullable: true
          type: string
        operation:
          $ref: '#/components/schemas/CraftExecutionOperation'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CraftExecutionNode'
        kind:
          $ref: '#/components/schemas/CraftExecutionNodeKind'
      required:
      - key
      - item_kind
      - required_quantity
      - completed_quantity
      - state
      - children
      - kind
    CraftExecutionNodeKind:
      oneOf:
      - type: object
        properties:
          recipe_id:
            type: string
          engine_type:
            type: string
          planned_crafts:
            type: integer
          completed_crafts:
            type: integer
          output_yield:
            type: integer
          type:
            type: string
            enum:
            - recipe
        required:
        - recipe_id
        - engine_type
        - planned_crafts
        - completed_crafts
        - output_yield
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - storage
            - any
        required:
        - type
    CraftExecutionOperation:
      type: object
      properties:
        kind:
          type: string
        state:
          type: string
        completed_amount:
          type: integer
        error:
          nullable: true
          type: string
      required:
      - kind
      - state
      - completed_amount
    CraftJobDetail:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/CraftJobStatus'
        root:
          $ref: '#/components/schemas/CraftExecutionNode'
      required:
      - job
      - root
    CraftJobState:
      type: string
      enum:
      - queued
      - waiting
      - running
      - completed
      - failed
    CraftJobStatus:
      type: object
      properties:
        id:
          type: string
        target_item_kind:
          type: string
        target_quantity:
          type: integer
        selections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CraftSelection'
        state:
          $ref: '#/components/schemas/CraftJobState'
        completed_quantity:
          type: integer
        error:
          nullable: true
          type: string
      required:
      - id
      - target_item_kind
      - target_quantity
      - selections
      - state
      - completed_quantity
    CraftNode:
      type: object
      properties:
        key:
          type: string
        item_kind:
          type: string
        quantity:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/CraftNode'
        kind:
          $ref: '#/components/schemas/CraftNodeKind'
      required:
      - key
      - item_kind
      - quantity
      - children
      - kind
    CraftNodeKind:
      oneOf:
      - type: object
        properties:
          recipe_id:
            type: string
          crafts:
            type: integer
          output_yield:
            type: integer
          selected:
            type: boolean
          type:
            type: string
            enum:
            - recipe
        required:
        - recipe_id
        - crafts
        - output_yield
        - selected
        - type
      - type: object
        properties:
          available:
            type: integer
          selected:
            type: boolean
          type:
            type: string
            enum:
            - storage
        required:
        - available
        - selected
        - type
      - type: object
        properties:
          options:
            type: array
            items:
              $ref: '#/components/schemas/CraftOption'
          type:
            type: string
            enum:
            - choice
        required:
        - options
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - any
            - deferred
        required:
        - type
    CraftOption:
      oneOf:
      - type: object
        properties:
          recipe_id:
            type: string
          preview:
            type: object
          available:
            type: boolean
          type:
            type: string
            enum:
            - recipe
        required:
        - recipe_id
        - preview
        - available
        - type
      - type: object
        properties:
          preview:
            type: object
          available:
            type: boolean
          type:
            type: string
            enum:
            - storage
        required:
        - preview
        - available
        - type
      - type: object
        properties:
          preview:
            type: object
          type:
            type: string
            enum:
            - any
        required:
        - preview
        - type
    CraftPlan:
      type: object
      properties:
        target_item_kind:
          type: string
        target_quantity:
          type: integer
        root:
          $ref: '#/components/schemas/CraftNode'
        raw_materials:
          type: array
          items:
            $ref: '#/components/schemas/RawMaterialRequirement'
        unresolved:
          type: boolean
      required:
      - target_item_kind
      - target_quantity
      - root
      - raw_materials
      - unresolved
    CraftPlanRequest:
      type: object
      properties:
        item_kind:
          type: string
        amount:
          type: integer
        selections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CraftSelection'
        job_id:
          nullable: true
          type: string
      required:
      - item_kind
      - amount
      - selections
    CraftQueueResponse:
      type: object
      properties:
        job_id:
          type: string
      required:
      - job_id
    CraftSelection:
      oneOf:
      - type: object
        properties:
          recipe_id:
            type: string
          type:
            type: string
            enum:
            - recipe
        required:
        - recipe_id
        - type
      - type: object
        properties:
          type:
            type: string
            enum:
            - storage
            - any
        required:
        - type
    IngredientResponse:
      type: object
      properties:
        item_kind:
          type: string
        quantity:
          type: integer
      required:
      - item_kind
      - quantity
    ItemKindDetails:
      type: object
      properties:
        item_kind:
          type: string
        total_quantity:
          type: integer
        stack_count:
          type: integer
        container_count:
          type: integer
        stacks:
          type: array
          items:
            $ref: '#/components/schemas/ItemKindStack'
      required:
      - item_kind
      - total_quantity
      - stack_count
      - container_count
      - stacks
    ItemKindStack:
      type: object
      properties:
        stack_id:
          type: string
        container_id:
          type: string
        region_id:
          type: string
        region_type:
          type: string
        position:
          $ref: '#/components/schemas/ItemPosition'
        slot:
          type: integer
        quantity:
          type: integer
        components:
          type: object
        components_digest:
          type: string
      required:
      - stack_id
      - container_id
      - region_id
      - region_type
      - position
      - slot
      - quantity
      - components
      - components_digest
    ItemPosition:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
      - x
      - y
      - z
    ItemStackView:
      type: object
      properties:
        id:
          type: string
        container_id:
          type: string
        item_kind:
          type: string
        slot:
          type: integer
        components:
          type: object
        quantity:
          type: integer
        components_digest:
          type: string
      required:
      - id
      - container_id
      - item_kind
      - slot
      - components
      - quantity
      - components_digest
    PlannerQueueItem:
      type: object
      properties:
        position:
          type: integer
        kind:
          $ref: '#/components/schemas/PlannerRequestKind'
        detail:
          nullable: true
          type: string
      required:
      - position
      - kind
    PlannerRequest:
      type: string
      enum:
      - IndexRegions
      - CycleCount
      - Putaway
    PlannerRequestKind:
      type: string
      enum:
      - index_regions
      - cycle_count
      - putaway
    QueueResponse:
      type: object
      properties:
        job_id:
          nullable: true
          type: string
    RawMaterialRequirement:
      type: object
      properties:
        item_kind:
          type: string
        quantity:
          type: integer
        available:
          type: integer
      required:
      - item_kind
      - quantity
      - available
    RecipeResponse:
      type: object
      properties:
        id:
          type: string
        output_item_kind:
          type: string
        output_yield:
          type: integer
        engine_type:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientResponse'
      required:
      - id
      - output_item_kind
      - output_yield
      - engine_type
      - ingredients
    Region:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/RegionType'
        priority:
          type: integer
        world_region:
          $ref: '#/components/schemas/RegionWorld'
      required:
      - id
      - type
      - priority
      - world_region
    RegionPoint:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
      - x
      - y
      - z
    RegionRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RegionType'
        priority:
          type: integer
        world_region:
          $ref: '#/components/schemas/RegionWorld'
      required:
      - type
      - priority
      - world_region
    RegionType:
      type: string
      enum:
      - bulk
      - pickface
      - putaway
      - processing
      - order
    RegionWorld:
      type: object
      properties:
        pos1:
          $ref: '#/components/schemas/RegionPoint'
        pos2:
          $ref: '#/components/schemas/RegionPoint'
      required:
      - pos1
      - pos2
    StorageItem:
      type: object
      properties:
        item_kind:
          type: string
        quantity:
          type: integer
        stack_count:
          type: integer
        container_count:
          type: integer
      required:
      - item_kind
      - quantity
      - stack_count
      - container_count
    StorageQuery:
      type: object
      properties:
        q:
          nullable: true
          type: string
        region_id:
          nullable: true
          type: string
        min_quantity:
          nullable: true
          type: integer
        sort_by:
          $ref: '#/components/schemas/StorageSortBy'
        sort_direction:
          $ref: '#/components/schemas/StorageSortDirection'
    StorageSortBy:
      type: string
      enum:
      - name
      - quantity
      - stacks
      - containers
    StorageSortDirection:
      type: string
      enum:
      - asc
      - desc
    SystemStatusResponse:
      type: object
      properties:
        planner_queue:
          type: array
          items:
            $ref: '#/components/schemas/PlannerQueueItem'
        work_unit_pool:
          $ref: '#/components/schemas/WorkUnitPoolSummary'
        work_units:
          type: array
          items:
            $ref: '#/components/schemas/WorkUnitStatus'
      required:
      - planner_queue
      - work_unit_pool
      - work_units
    WorkUnitKind:
      type: string
      enum:
      - index_region
      - index_container
      - transfer
      - craft
    WorkUnitPoolSummary:
      type: object
      properties:
        total:
          type: integer
        queued:
          type: integer
        claimed:
          type: integer
        completed:
          type: integer
      required:
      - total
      - queued
      - claimed
      - completed
    WorkUnitStatus:
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/WorkUnitKind'
        state:
          $ref: '#/components/schemas/WorkUnitStatusState'
        priority:
          type: integer
        completed_steps:
          nullable: true
          type: integer
        total_steps:
          nullable: true
          type: integer
        detail:
          type: string
      required:
      - id
      - kind
      - state
      - priority
      - detail
    WorkUnitStatusState:
      type: string
      enum:
      - queued
      - claimed
      - completed
