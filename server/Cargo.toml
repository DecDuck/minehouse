[package]
edition = "2024"
name = "server"
version = "0.1.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
common = { path = "../common" }
dashmap = "6.2.1"
futures = "0.3.34"
oasgen = { version = "0.25.0", features = ["axum", "swagger-ui"] }
serde = "1.0.229"
serde_yaml2 = "0.1.3"
sqlx = { version = "0.9.0", features = ["json", "macros", "postgres", "runtime-tokio", "uuid"] }
tarpc = "0.38.0"
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.25.0"
